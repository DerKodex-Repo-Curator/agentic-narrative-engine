<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Adventure</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* Game tabs (shown only when more than one game is open) */
        .tab-bar { display: none; align-items: flex-end; gap: 4px; padding: 8px 24px 0; overflow-x: auto; flex-shrink: 0; border-bottom: 1px solid rgba(128,128,128,0.25); }
        .game-tab { display: flex; align-items: center; gap: 8px; padding: 7px 6px 7px 12px; border: 1px solid transparent; border-bottom: none; border-radius: 8px 8px 0 0; font-size: 13px; white-space: nowrap; cursor: pointer; opacity: 0.65; user-select: none; }
        .game-tab:hover { opacity: 1; }
        .game-tab.active { opacity: 1; font-weight: 600; border-color: rgba(128,128,128,0.3); background: rgba(128,128,128,0.12); }
        .tab-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(128,128,128,0.5); }
        .game-tab.running .tab-dot { background: #f5a524; animation: tabPulse 1s infinite; }
        .game-tab.done .tab-dot { background: #2ecc71; }
        .game-tab.error .tab-dot { background: #e5484d; }
        @keyframes tabPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
        .tab-close, .tab-add { border: none; background: transparent; color: inherit; cursor: pointer; line-height: 1; border-radius: 4px; }
        .tab-close { font-size: 16px; padding: 2px 6px; opacity: 0.6; }
        .tab-close:hover { opacity: 1; background: rgba(128,128,128,0.25); }
        .tab-add { font-size: 20px; padding: 4px 10px 6px; opacity: 0.7; }
        .tab-add:hover:not(:disabled) { opacity: 1; background: rgba(128,128,128,0.2); }
        .tab-add:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Loader bubble: animated dots while the AI is working */
        .typing { display: inline-flex; align-items: center; gap: 12px; }
        .typing-dots { display: inline-flex; gap: 5px; }
        .typing-dots span { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: 0.3; animation: typingBounce 1.2s infinite ease-in-out; }
        .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
        .typing-text { font-size: 13px; opacity: 0.7; }
        @keyframes typingBounce { 0%, 70%, 100% { transform: translateY(0); opacity: 0.3; } 35% { transform: translateY(-5px); opacity: 1; } }

        /* Dropdowns: drawn by the page instead of the browser/OS, so they look the same on every device */
        .sidebar-select {
            -webkit-appearance: none !important; -moz-appearance: none !important; appearance: none !important;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1.5l5 5 5-5' fill='none' stroke='%23cdd6f4' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>") !important;
            background-repeat: no-repeat !important;
            background-position: right 14px center !important;
            background-size: 12px 8px !important;
            padding-right: 38px !important;
            text-overflow: ellipsis;
            color-scheme: dark;
        }
        .sidebar-select option { background-color: #292a3b; color: #cdd6f4; }

        /* Message shown in an empty chat (names match the buttons below) */
        .chatbox:empty::before { content: "Press \"Start Game\" to play step by step, or \"Auto-play All Steps\" to let the AI play for you" !important; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <button id="newGameBtn" class="new-chat-btn" title="Open another game in a new tab (your current game keeps running)">+ New Game Tab</button>

            <div class="divider"></div>

            <p class="settings-label">AI Provider</p>
            <select id="providerSelect" class="sidebar-select">
                {% for provider in providers %}
                <option value="{{ provider }}" {% if provider == 'Groq' %}selected{% endif %}>{{ provider }}</option>
                {% endfor %}
            </select>

            <select id="modelSelect" class="sidebar-select">
                <option value="llama-3.1-8b-instant">llama-3.1-8b-instant</option>
            </select>

            <input type="password" id="apiKey" class="sidebar-input" placeholder="API Key">
            <input type="text" id="apiUrl" class="sidebar-input" placeholder="Custom API URL (optional)" style="display: none;">

            <div class="divider"></div>

            <p class="settings-label">Game Settings</p>

            <div class="slider-container">
                <label for="stepsSlider">Steps: <span id="stepsValue">10</span></label>
                <input type="range" id="stepsSlider" min="1" max="20" value="10">
            </div>

            <div class="slider-container">
                <label for="delaySlider">Auto-play delay: <span><span id="delayValue">3</span>s</span></label>
                <input type="range" id="delaySlider" min="0" max="10" value="3">
            </div>

            <div class="slider-container">
                <label for="repetitionsSlider">Repetitions: <span id="repetitionsValue">0</span></label>
                <input type="range" id="repetitionsSlider" min="0" max="100" value="0" title="0 = play once. Otherwise Auto-play resets the game and plays it again this many times, with no clicks in between">
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="main-chat">
            <!-- Header -->
            <header class="app-header">
                <h1 class="app-title">RPG Adventure</h1>
                <span class="model-badge" id="modelBadge">Select a provider to start</span>
            </header>

            <!-- Game tabs: each tab is an independent game that can run in parallel -->
            <div id="tabBar" class="tab-bar" role="tablist"></div>

            <!-- Chat Container -->
            <div class="chat-container">
                <div id="chatbox" class="chatbox">
                    <!-- Messages will be inserted here -->
                </div>
            </div>

            <!-- Status Bar -->
            <div id="statusBar" class="status-bar">
                Ready to start your adventure. Configure your AI provider, then click <strong>Start Game</strong> or <strong>Auto-play All Steps</strong>.
            </div>

            <!-- Button Row -->
            <div class="button-row">
                <button id="startBtn" class="action-btn" title="Start a new story, then play it yourself with &quot;Next Step&quot;">Start Game</button>
                <button id="nextBtn" class="secondary-action" title="Play one step of the story">Next Step</button>
                <button id="autoplayBtn" class="secondary-action" title="Start a new story and let the AI play all steps automatically">Auto-play All Steps</button>
                <button id="stopBtn" class="danger-action" style="display: none;" title="Pause the automatic play (you can resume it)">Pause Auto-play</button>
                <button id="resumeBtn" class="resume-action" style="display: none;" title="Continue the automatic play where it was paused">Resume Auto-play</button>
                <button id="continueBtn" class="success-action" style="display: none;" title="Choose how many steps to add, and play them yourself or automatically">Add Custom Steps...</button>
                <button id="resetBtn" class="reset-action" title="Clear this game and start over (other tabs are not affected)">Reset This Game</button>
            </div>
        </main>
    </div>

    <!-- Continue Story Modal -->
    <div id="continueModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add More Steps</h2>
                <button id="closeModal" class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="modal-field">
                    <label for="addStepsInput">How many steps to add?</label>
                    <input type="number" id="addStepsInput" class="modal-input" min="1" max="50" value="5">
                </div>
                <div class="modal-field">
                    <label>Play Mode</label>
                    <div class="mode-buttons">
                        <button id="modeManual" class="mode-btn active">
                            <span class="mode-icon">🎮</span>
                            <span class="mode-label">Manual</span>
                            <span class="mode-desc">Step by step</span>
                        </button>
                        <button id="modeAuto" class="mode-btn">
                            <span class="mode-icon">🤖</span>
                            <span class="mode-label">Auto-play</span>
                            <span class="mode-desc">AI plays for you</span>
                        </button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="cancelContinue" class="secondary-action">Cancel</button>
                <button id="confirmContinue" class="success-action">Add Steps</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
